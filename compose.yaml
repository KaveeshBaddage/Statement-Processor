
services:
  statement-processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: statement-processor:local
    container_name: statement-processor
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: docker
      BANK_API_BASE_URL: http://host.docker.internal:3000
      MONTHLY_SUMMARY_API_BASE_URL: http://host.docker.internal:3000
      APP_LOG_LEVEL: INFO
      APP_ENV: ${APP_ENV:-local}
    restart: unless-stopped
